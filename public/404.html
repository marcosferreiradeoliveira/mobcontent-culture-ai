<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages não suporta SPA: ao acessar uma rota interna direto, retorna 404.
      // Salvamos o path no sessionStorage e redirecionamos para a raiz.
      // O index.html restaura a URL correta antes do React Router inicializar.
      // (Este arquivo deve ter pelo menos 512 bytes para alguns navegadores.)
      var path = window.location.pathname;
      var search = window.location.search;
      sessionStorage.setItem('redirect', path + search);
      window.location.replace('/');
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
    <!-- padding for 512 bytes -->
    <!-- ....................................................................................... -->
    <!-- ....................................................................................... -->
    <!-- ....................................................................................... -->
    <!-- ....................................................................................... -->
  </body>
</html>
